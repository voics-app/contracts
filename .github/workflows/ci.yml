name: ci

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # The VM runner keeps its pnpm store. Uploading that shared store stalled
          # a job after all validations passed; hosted runners still cache.
          cache: ${{ vars.CI_RUNNER != 'vm-runner' && 'pnpm' || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - run: pnpm install --frozen-lockfile
      - name: Validate schemas and OpenAPI
        run: pnpm validate
      - name: Regenerate and fail on drift
        run: |
          pnpm codegen
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Elixir package
        working-directory: packages/elixir
        run: |
          mix deps.get
          mix format --check-formatted
          mix credo --strict
          mix test
      - run: pnpm build
