openapi: 3.1.0
info:
  title: Discordy internal API
  version: 0.1.0
  description: "Service-to-service HTTP APIs (`/internal/v1`). Every call carries `X-Internal-Token: $INTERNAL_SERVICE_TOKEN`. Tags name the owning service. `GET /admin/stats` exists on api, messages and gateway with the shapes ApiAdminStats, MessagesAdminStats and GatewayAdminStats respectively."
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://api:8080/internal/v1
    description: api
  - url: http://messages:8082/internal/v1
    description: messages
  - url: http://gateway:4000/internal/v1
    description: gateway
security:
  - InternalToken: []
tags:
  - name: api
    description: Served by api (port 8080).
  - name: messages
    description: Served by messages (port 8082).
  - name: gateway
    description: Served by gateway (port 4000).
paths:
  /scheduled-event-deliveries/claim:
    post:
      operationId: claimScheduledEventDelivery
      summary: Lease one pending event push delivery for 60 seconds
      tags: [api]
      responses:
        "200":
          description: A lease or null when no delivery is ready.
          content:
            application/json:
              schema: { type: [object, "null"], description: "Lease carries delivery_id, lease_id, guild_id, event_id, user_id, scheduled_start_time and revision." }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /scheduled-event-deliveries/{delivery_id}/resolve:
    post:
      operationId: resolveScheduledEventDelivery
      summary: Recheck one leased delivery and resolve its current eligible token
      tags: [api]
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id]
              properties: { lease_id: { type: string, format: uuid } }
      responses:
        "200":
          description: Current live eligible token, or null when no longer eligible.
          content:
            application/json:
              schema: { type: [object, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Lease expired or was replaced. }
  /scheduled-event-deliveries/{delivery_id}/finish:
    post:
      operationId: finishScheduledEventDelivery
      summary: Acknowledge a terminal result or release the lease for retry
      tags: [api]
      parameters:
        - name: delivery_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, retry_after_secs]
              properties:
                lease_id: { type: string, format: uuid }
                retry_after_secs: { type: [integer, "null"], minimum: 1, maximum: 60 }
      responses:
        "204": { description: Delivery acknowledged or scheduled for retry. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Lease expired or was replaced. }
  /guilds/{guild_id}/scheduled-events/{event_id}/push-targets:
    get:
      operationId: getScheduledEventPushTargets
      summary: Recheck one event reminder recipient and return live notification tokens
      description: Rechecks membership, channel visibility, current interest, mute, do-not-disturb, start time and schedule revision. Event names are not returned; pushes must use generic text. An empty users array means no push.
      tags: [api]
      parameters:
        - name: guild_id
          in: path
          required: true
          schema: { $ref: ../schemas/objects/snowflake.json }
        - name: event_id
          in: path
          required: true
          schema: { $ref: ../schemas/objects/snowflake.json }
        - name: user_id
          in: query
          required: true
          schema: { $ref: ../schemas/objects/snowflake.json }
        - name: scheduled_start_time
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: revision
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Current permitted live notification tokens, or an empty audience.
          content:
            application/json:
              schema: { $ref: ../schemas/internal/scheduled-event-push-targets.json }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /id-reservations:
    post:
      operationId: reserveMessageIds
      summary: Acquire or renew a committed Snowflake interval for one messages process
      tags: [api]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/internal/id-reservation-request.json
      responses:
        "200":
          description: Committed interval. Timestamp and monotonic deadline checks are mandatory.
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/id-reservation.json
        "400":
          description: Invalid service, owner, worker or request shape.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Capacity exhausted, expired ownership, clock rollback, restore barrier or unavailable database. No new interval was granted.
  /auth/introspect:
    post:
      operationId: introspectToken
      summary: Validate a user or bot token
      tags:
        - api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/internal/introspect-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/introspect-response.json
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{user_id}/ready:
    get:
      operationId: getUserReadyState
      summary: State used to build READY
      tags:
        - api
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/user-ready.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{user_id}/read-states:
    get:
      operationId: getUserReadStates
      summary: Read-state snapshots for gateway identification and resume
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Array retained for legacy compatibility. Certified responses require a version on every entry. Snapshot reads are per channel, not one cross-channel transaction.
          headers:
            X-Read-State-Versioned:
              description: Value 1 certifies authoritative versioned accounting even for an empty array. Absent means legacy; malformed certification must not become an empty successful snapshot.
              schema:
                type: string
                const: "1"
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/user-read-states.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Read-state dependency unavailable; gateway must not certify an empty state.
  /guilds/{guild_id}/state:
    get:
      operationId: getGuildState
      summary: Full guild state for the gateway guild process
      tags:
        - api
      parameters:
        - $ref: "#/components/parameters/guild_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/gateway-guild-state.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/{channel_id}/access/{user_id}:
    get:
      operationId: getChannelAccess
      summary: Permissions and effective delivery mode of a user in a channel
      description: "Resolves current account eligibility as well as membership and channel permissions. Missing, disabled, pending-deletion or currently suspended users receive 403. Expired suspensions and eligible bots retain ordinary channel access. No user session/token is required by this internal lookup; an offline scheduled author can remain eligible. Consumers needing fresh dispatch authorization must bypass cached and already in-flight lookups. This check and a later message write are not one cross-service transaction."
      tags:
        - api
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/channel-access.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/{channel_id}/users/{user_id}/stickers/{sticker_id}:
    get:
      operationId: resolveMessageSticker
      summary: Resolve an available guild sticker for a message author and destination
      description: Checks current account eligibility, channel membership, view and send permissions, Standard delivery and that the sticker is built-in or belongs to the destination guild. Authorization and message storage are not one transaction.
      tags: [api]
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/user_id"
        - name: sticker_id
          in: path
          required: true
          description: Sticker ID.
          schema:
            $ref: ../schemas/objects/snowflake.json
      responses:
        "200":
          description: Available sticker metadata.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/sticker.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/{channel_id}/notification-recipients:
    get:
      operationId: listNotificationRecipients
      summary: Page permitted recipients and resolved preferences independently of push tokens
      description: "For messages mention accounting. Includes users without a mobile push token, excludes the author and users without VIEW_CHANNEL, and returns an empty terminal page for private delivery modes. limit bounds candidates examined, so a page filtered by permissions can be empty while next_after is non-null. Follow next_after until null; it strictly advances by candidate user ID. Policy is current per request, not a historical or cross-page snapshot. The consumer still applies message kind, mentions, silent/reply flags and idempotent read-state accounting."
      tags: [api]
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - name: author_id
          in: query
          required: true
          description: Message author to exclude, including a webhook author ID. Decimal ID in 0..9223372036854775807.
          schema:
            $ref: ../schemas/objects/snowflake.json
        - name: after
          in: query
          required: false
          description: Continue strictly after this candidate user ID. Decimal ID in 0..9223372036854775807; values outside the database range are rejected rather than wrapped.
          schema:
            $ref: ../schemas/objects/snowflake.json
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Current permitted recipients; empty pages can still have a continuation.
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/notification-recipient-page.json
        "400":
          description: Invalid author, continuation or page size.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Recipient or preference lookup failed; no fallback to unfiltered users.
  /admin/stats:
    get:
      operationId: getApiAdminStats
      summary: Service statistics (api, messages and gateway each answer with their own shape)
      tags:
        - api
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: ../schemas/internal/api-admin-stats.json
                  - $ref: ../schemas/internal/messages-admin-stats.json
                  - $ref: ../schemas/internal/gateway-admin-stats.json
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: Search users
      tags:
        - api
      parameters:
        - name: query
          in: query
          required: false
          description: Username or email substring.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: after
          in: query
          required: false
          description: Return users with a higher ID.
          schema: &a1
            $ref: ../schemas/objects/snowflake.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/admin-user-page.json
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      summary: Suspend a user
      tags:
        - api
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/internal/suspend-user-request.json
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/guilds:
    get:
      operationId: listAdminGuilds
      summary: Search guilds
      tags:
        - api
      parameters:
        - name: query
          in: query
          required: false
          description: Guild name substring.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../schemas/internal/admin-guild.json
        "401":
          $ref: "#/components/responses/Unauthorized"
  /channels/{channel_id}/forum-start:
    post:
      operationId: createForumStart
      summary: Store the reserved opening message after a durable API claim
      description: The messages service atomically stores an idempotency marker and the reserved opening message in one partition; a replay cannot recreate a deleted opening.
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author_id, message_id, content]
              properties:
                author_id:
                  $ref: ../schemas/objects/snowflake.json
                message_id:
                  $ref: ../schemas/objects/snowflake.json
                content:
                  type: string
      responses:
        "200":
          description: Stored message.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/message.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: The reserved opening message was deleted; the marker prevents recreation.
  /forum-summaries:
    post:
      operationId: forumSummaries
      summary: Summarize already authorized Standard forum posts
      tags:
        - messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_ids]
              properties:
                channel_ids:
                  type: array
                  maxItems: 50
                  items:
                    $ref: ../schemas/objects/snowflake.json
      responses:
        "200":
          description: First message, last message ID and exact stored count per channel.
          content:
            application/json:
              schema:
                type: object
                required: [summaries]
                properties:
                  summaries:
                    type: array
                    items:
                      type: object
                      required: [channel_id, message_count, first_message, last_message_id]
                      properties:
                        channel_id:
                          $ref: ../schemas/objects/snowflake.json
                        message_count:
                          type: integer
                          minimum: 0
                        first_message:
                          anyOf:
                            - type: object
                              required: [id, content, attachments]
                              properties:
                                id:
                                  $ref: ../schemas/objects/snowflake.json
                                content:
                                  type: string
                                attachments:
                                  type: array
                                  items:
                                    $ref: ../schemas/objects/attachment.json
                            - type: "null"
                        last_message_id:
                          anyOf:
                            - $ref: ../schemas/objects/snowflake.json
                            - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /channels/{channel_id}/messages:
    post:
      operationId: createInternalMessage
      summary: Post a bot, webhook, interaction or system message (messages service)
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/internal/messages-create-request.json
      responses:
        "200":
          description: The created message.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/message.json
        "400":
          description: Invalid body, for example type 18 without thread_id.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The channel is not in standard delivery mode (code 50160).
  /channels/{channel_id}/messages/{message_id}/crossposted:
    post:
      operationId: markAnnouncementCrossposted
      summary: Mark a stored announcement as published (messages service)
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/message_id"
      responses:
        "200":
          description: Updated source message.
          content:
            application/json:
              schema: { $ref: ../schemas/objects/message.json }
        "400": { description: Not a publishable announcement. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /channels/{channel_id}/crossposts:
    post:
      operationId: deliverAnnouncementCrosspost
      summary: Deliver a claimed announcement to a follower channel (messages service)
      description: The caller supplies a reserved ID and must not blindly retry an ambiguous result after the destination has disappeared.
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_channel_id, message_id, webhook_id, webhook_name, snapshot]
              properties:
                source_channel_id: { $ref: ../schemas/objects/snowflake.json }
                message_id: { $ref: ../schemas/objects/snowflake.json }
                webhook_id: { $ref: ../schemas/objects/snowflake.json }
                webhook_name: { type: string }
                snapshot:
                  type: object
                  required: [content]
                  properties:
                    content: { type: string }
                    embeds: { type: array, items: { type: object, additionalProperties: true } }
                    attachments:
                      type: array
                      items:
                        type: object
                        required: [id, filename, size]
                        properties:
                          id: { $ref: ../schemas/objects/snowflake.json }
                          filename: { type: string }
                          size: { type: integer, minimum: 0 }
                          content_type: { type: [string, "null"] }
                          width: { type: [integer, "null"], minimum: 0 }
                          height: { type: [integer, "null"], minimum: 0 }
                          description: { type: [string, "null"] }
                          flags: { type: [integer, "null"], minimum: 0 }
      responses:
        "200":
          description: Stored destination message, or an already present matching destination.
          content:
            application/json:
              schema: { $ref: ../schemas/objects/message.json }
        "400": { description: Invalid snapshot or unavailable attachment. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Destination does not support standard delivery. }
  /channels/{channel_id}/messages/{message_id}/call:
    patch:
      operationId: updateMessageCall
      summary: Record the end of a call on its system message (messages service)
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/message_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/internal/messages-update-call-request.json
      responses:
        "200":
          description: The updated message.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/message.json
        "400":
          description: Not a call message or invalid timestamp.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /channels/{channel_id}/last-message-id:
    get:
      operationId: getLastMessageId
      summary: Last message ID of a channel (messages service)
      tags:
        - messages
      parameters:
        - $ref: "#/components/parameters/channel_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/internal/messages-last-message-id.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /voice/nodes/{node_id}/drain:
    post:
      operationId: drainVoiceNode
      summary: Stop allocating to a voice node (gateway)
      tags:
        - gateway
      parameters:
        - $ref: "#/components/parameters/node_id"
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /voice/nodes/{node_id}/undrain:
    post:
      operationId: undrainVoiceNode
      summary: Resume allocating to a voice node (gateway)
      tags:
        - gateway
      parameters:
        - $ref: "#/components/parameters/node_id"
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    user_id:
      name: user_id
      in: path
      required: true
      description: User ID.
      schema: *a1
    guild_id:
      name: guild_id
      in: path
      required: true
      description: Guild ID.
      schema: *a1
    channel_id:
      name: channel_id
      in: path
      required: true
      description: Channel ID.
      schema: *a1
    id:
      name: id
      in: path
      required: true
      description: User ID.
      schema: *a1
    message_id:
      name: message_id
      in: path
      required: true
      description: Message ID.
      schema: *a1
    node_id:
      name: node_id
      in: path
      required: true
      description: Voice node ID.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid X-Internal-Token.
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
    Forbidden:
      description: The user is not a member of the channel.
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
    NotFound:
      description: Unknown resource.
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
