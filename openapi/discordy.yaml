      - $ref: "#/components/parameters/channel_id"
      - $ref: "#/components/parameters/message_id"
      - name: answer_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10
    put:
      operationId: selectPollAnswer
      summary: Select a poll answer with your current vote revision
      description: Authenticated human users only, with fresh VIEW_CHANNEL and READ_MESSAGE_HISTORY in a Standard channel. Single-choice selection replaces the previous answer atomically; multi-choice adds this answer. An already-satisfied retry is a no-op. A stale version that changes the selection conflicts. The global results version is not the voter precondition. Bots cannot vote. At most 100000 distinct participants, including retracted voters, are admitted.
      tags: [Messages]
      x-discordy-service: messages
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/poll-vote-request.json
      responses:
        "200":
          $ref: "#/components/responses/PollSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PollConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/PollUnavailable"
    delete:
      operationId: removePollAnswer
      summary: Retract a poll answer with your current vote revision
      description: Same fresh access and human-user restrictions as selecting an answer. Removing an already-absent answer is a no-op. Retain the original expected version when retrying a lost response; refresh after a conflicting later selection.
      tags: [Messages]
      x-discordy-service: messages
      security:
        - UserBearer: []
      parameters:
        - name: expected_vote_version
          in: query
          required: true
          schema:
            $ref: ../schemas/objects/poll-version.json
      responses:
        "200":
          $ref: "#/components/responses/PollSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PollConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/PollUnavailable"
  /channels/{channel_id}/polls/{message_id}/expire:
    post:
      operationId: expirePoll
      summary: End your own poll early
      description: The original author alone may end a poll, with fresh VIEW_CHANNEL and READ_MESSAGE_HISTORY in the Standard channel. MANAGE_MESSAGES grants deletion, not author impersonation. Repeated expiry returns the already-finalized result. A competing vote either commits before the closing fence and is counted, or is rejected. Publishes MESSAGE_UPDATE with complete finalized results. Public bot authors may end their own poll but may not vote.
      tags: [Messages]
      x-discordy-service: messages
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/message_id"
      responses:
        "200":
          description: Message with finalized poll results.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/message.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PollConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/PollUnavailable"
  /channels/{channel_id}/messages/scheduled:
    get:
      operationId: listScheduledMessages
      summary: List your scheduled messages in a channel
      description: Author-private UUID-ordered page of active/unknown schedules and terminal jobs from the last seven days. Remains available after send permission or membership loss, without granting channel history access. Follow every non-null next_after, including after an empty filtered page. This additive proposal requires scheduler implementation before use.
      tags:
        - Messages
      x-discordy-service: messages
      security:
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - name: after
          in: query
          description: Exclusive last examined schedule UUID from next_after.
          schema:
            $ref: ../schemas/objects/scheduled-message-id.json
        - name: limit
          in: query
          description: Maximum rows examined in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Your schedules only.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/scheduled-message-list.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ScheduledMessageUnavailable"
    post:
      operationId: createScheduledMessage
      summary: Schedule a Standard text message
      description: Fresh VIEW_CHANNEL and send permission are required now and after the dispatch claim, including SEND_TTS_MESSAGES when requested. Private delivery returns 409/50160. A new instant must be 1 minute to 30 days ahead of the server clock. At most 100 active intents per author and 25 per channel are allowed, including preparing/dispatching reservations. Persist the exact request and random request_id before sending; identical author/key requests return the current job even after edits or dispatch, without rechecking original time/current access. Another original body or channel conflicts. One durable dispatch claim permits one send attempt; ambiguous outcomes become delivery_unknown without automatic redispatch. Bots, webhooks and application tokens are excluded.
      tags:
        - Messages
      x-discordy-service: messages
      security:
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/create-scheduled-message-request.json
      responses:
        "201":
          $ref: "#/components/responses/ScheduledMessageResult"
        "200":
          $ref: "#/components/responses/ScheduledMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduledMessageConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ScheduledMessageUnavailable"
  /channels/{channel_id}/messages/scheduled/{schedule_id}:
    get:
      operationId: getScheduledMessage
      summary: Read one of your scheduled messages
      description: Only the author can read it. Another author or channel returns 404. Remains available after membership/send access loss. Terminal records retain no draft text, even after their seven-day list visibility expires.
      tags:
        - Messages
      x-discordy-service: messages
      security:
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/schedule_id"
      responses:
        "200":
          $ref: "#/components/responses/ScheduledMessageResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ScheduledMessageUnavailable"
    patch:
      operationId: editScheduledMessage
      summary: Edit your pending scheduled message
      description: Requires current Standard send access and a matching expected_revision. At least one field replacement is required; message replaces the complete draft. A new time must be 1 minute to 30 days ahead. Already-dispatching and terminal schedules conflict. Refetch a stale revision instead of overwriting another device's edit.
      tags:
        - Messages
      x-discordy-service: messages
      security:
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/schedule_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/edit-scheduled-message-request.json
      responses:
        "200":
          $ref: "#/components/responses/ScheduledMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduledMessageConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ScheduledMessageUnavailable"
    delete:
      operationId: cancelScheduledMessage
      summary: Cancel your pending scheduled message
      description: Author-only; works after membership/send access loss. CAS with expected_revision competes with dispatch, so a successful cancellation guarantees no first dispatch claim. An already-cancelled job returns its current state regardless of the supplied revision. Other non-pending or stale states conflict. This does not delete a sent message.
      tags:
        - Messages
      x-discordy-service: messages
      security:
        - UserBearer: []
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/schedule_id"
        - name: expected_revision
          in: query
          required: true
          description: Revision observed before cancellation.
          schema:
            $ref: ../schemas/objects/scheduled-message-revision.json
      responses:
        "200":
          $ref: "#/components/responses/ScheduledMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ScheduledMessageConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ScheduledMessageUnavailable"
  /guilds/{guild_id}/messages/search:
    get:
      operationId: searchGuildMessages
      summary: Search guild messages
      description: |-
        Searches the standard-mode messages of every channel of the guild the caller can view and read the history of. Results come from a full-text index fed from `discordy.message.v1`, so a new or edited message becomes searchable after a short delay (normally under 2 seconds). Ephemeral and P2P messages are end-to-end encrypted, never stored in plaintext and never returned; search them in the client's local history. Each element of `messages` is a group: the hit (`hit: true`) with `context` messages on either side, oldest first. At most 10 searches per 10 seconds per user.
      tags:
        - Messages
      x-discordy-service: messages
      parameters:
        - $ref: "#/components/parameters/guild_id"
        - name: content
          in: query
          required: false
          description: Words to match (up to 512 characters). Matching is case-insensitive and word based; quoted phrases, `-` exclusions and `or` follow web-search syntax.
          schema:
            type: string
            maxLength: 512
        - name: author_id
          in: query
          required: false
          description: Only messages by these users (repeat the parameter, up to 10).
          schema:
            type: array
            maxItems: 10
            items: *a1
        - name: mentions
          in: query
          required: false
          description: Only messages that mention these users (repeat the parameter, up to 10).
          schema:
            type: array
            maxItems: 10
            items: *a1
        - name: has
          in: query
          required: false
          description: Only messages with all of these attachments.
          schema:
            type: array
            maxItems: 6
            items:
              type: string
              enum: [link, embed, file, image, video, sound]
        - name: channel_id
          in: query
          required: false
          description: Only messages in these channels (repeat the parameter, up to 20). Channels the caller cannot read are ignored.
          schema:
            type: array
            maxItems: 20
            items: *a1
        - name: min_id
          in: query
          required: false
          description: Only messages with an ID greater than this one (to search after a date, use the first snowflake of that day).
          schema: *a1
        - name: max_id
          in: query
          required: false
          description: Only messages with an ID lower than this one (to search before a date, use the first snowflake of that day).
          schema: *a1
        - name: pinned
          in: query
          required: false
          description: Only pinned (`true`) or only unpinned (`false`) messages.
          schema:
            type: boolean
        - name: sort_by
          in: query
          required: false
          description: Order by creation time or by text relevance (relevance needs `content`).
          schema:
            type: string
            enum: [timestamp, relevance]
            default: timestamp
        - name: sort_order
          in: query
          required: false
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: offset
          in: query
          required: false
          description: Number of results to skip (0-9975).
          schema:
            type: integer
            minimum: 0
            maximum: 9975
            default: 0
        - name: limit
          in: query
          required: false
          description: Max number of hits (1-25).
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 25
        - name: context
          in: query
          required: false
          description: Messages of context returned before and after each hit (0-2).
          schema:
            type: integer
            minimum: 0
            maximum: 2
            default: 1
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/message-search-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
