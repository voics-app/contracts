                items:
                  $ref: ../schemas/objects/channel.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: startThread
      summary: Start a thread (or forum post)
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/create-thread-request.json
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/channel.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /channels/{channel_id}/followers:
    post:
      operationId: followAnnouncementChannel
      summary: Follow an announcement channel into another server
      tags: [Webhooks]
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
