      tags: [Guilds]
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/member-verification-request.json
      responses:
        "200":
          description: Saved configuration with new revision.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/member-verification.json
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /guilds/{guild_id}/member-verification/accept:
    parameters:
      - $ref: "#/components/parameters/guild_id"
    post:
      operationId: acceptMemberVerification
      summary: Accept the current version of the server rules
      description: A stale revision returns 409; fetch and display the current rules before retrying.
      tags: [Guilds]
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, minimum: 0 }
      responses:
        "204": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The rules changed. }
  /guilds/{guild_id}/onboarding:
    parameters:
      - $ref: "#/components/parameters/guild_id"
    get:
      operationId: getGuildOnboarding
      summary: Get onboarding questions and their revision
      tags: [Guilds]
      x-discordy-service: api
      responses:
        "200":
          description: Configuration and revision.
          content:
            application/json:
              schema: { $ref: ../schemas/objects/onboarding-response.json }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putGuildOnboarding
      summary: Replace onboarding questions (MANAGE_GUILD; roles also require MANAGE_ROLES)
      tags: [Guilds]
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/objects/onboarding-config.json }
      responses:
        "200":
          description: Saved configuration and revision.
          content:
            application/json:
              schema: { $ref: ../schemas/objects/onboarding-response.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /guilds/{guild_id}/onboarding/complete:
    parameters:
      - $ref: "#/components/parameters/guild_id"
    post:
      operationId: completeGuildOnboarding
      summary: Apply one choice per question once, after accepting the rules
      tags: [Guilds]
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, choices]
              properties:
                revision: { type: integer, minimum: 0 }
                choices: { type: array, maxItems: 5, items: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Suggested channel IDs from the selected options.
          content:
            application/json:
              schema:
                type: object
                required: [channel_ids]
                properties:
                  channel_ids: { type: array, items: { $ref: ../schemas/objects/snowflake.json } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Configuration changed, an eligible role changed, or onboarding was already completed." }
  /guilds/{guild_id}/welcome-screen:
    parameters:
      - $ref: "#/components/parameters/guild_id"
    get:
      operationId: getWelcomeScreen
      summary: Get the welcome screen, filtered to channels the caller can view
      tags: [Guilds]
      x-discordy-service: api
      responses:
        "200":
          description: Welcome screen.
          content:
            application/json:
              schema: { $ref: ../schemas/objects/welcome-screen.json }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putWelcomeScreen
      summary: Replace the welcome screen (MANAGE_GUILD)
      tags: [Guilds]
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/objects/welcome-screen.json }
      responses:
        "200":
          description: Saved welcome screen.
          content:
            application/json:
              schema: { $ref: ../schemas/objects/welcome-screen.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /guilds/{guild_id}/vanity-url:
    parameters:
      - $ref: "#/components/parameters/guild_id"
    get:
      operationId: getGuildVanityUrl
      summary: Get a guild's permanent invitation (requires MANAGE_GUILD)
      tags:
        - Guilds
      x-discordy-service: api
      responses:
        "200":
          description: Current code and join count, or null and zero when unset.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/vanity-url.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: modifyGuildVanityUrl
      summary: Set or remove a guild's permanent invitation (requires MANAGE_GUILD)
      description: Codes are case-insensitive and returned lowercase. Renaming resets uses. An @everyone-visible text channel is required. Changes create a GUILD_UPDATE audit entry. An occupied code returns 400 with a code field error.
      tags:
        - Guilds
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/modify-vanity-url-request.json
      responses:
        "200":
          description: Saved code and join count.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/vanity-url.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /guilds/{guild_id}/webhooks:
    get:
      operationId: listGuildWebhooks
      summary: List a guild's webhooks
      tags:
        - Webhooks
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/guild_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../schemas/objects/webhook.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /channels/{channel_id}:
    get:
      operationId: getChannel
      summary: Get a channel
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/channel.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: modifyChannel
      summary: Modify a channel (including delivery_mode and voice_region)
      description: Group DMs accept name and icon (posts CHANNEL_NAME_CHANGE / CHANNEL_ICON_CHANGE system messages, dispatches CHANNEL_UPDATE). ephemeral is rejected (400) for guild channels viewable by more than 100 members; p2p is rejected for guild channels.
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/modify-channel-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/channel.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteChannel
      summary: Delete a channel, leave a group DM or close a DM
      description: For a group DM the caller leaves (same as DELETE /channels/{id}/recipients/@me). Closing a 1:1 DM is client-side state.
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/channel.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /channels/{channel_id}/voice-status:
    put:
      operationId: setVoiceChannelStatus
      summary: Set or clear a voice channel status
      description: Requires channel visibility and SET_VOICE_CHANNEL_STATUS or current connection to that channel. Dispatches CHANNEL_UPDATE.
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/voice-status-request.json
      responses:
        "204":
          description: Status saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The gateway voice-state lookup is unavailable.
  /channels/{channel_id}/permissions/{overwrite_id}:
    put:
      operationId: editChannelPermissions
      summary: Create or edit a permission overwrite
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/overwrite_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/edit-overwrite-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteChannelPermission
      summary: Delete a permission overwrite
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/overwrite_id"
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /channels/{channel_id}/invites:
    post:
      operationId: createChannelInvite
      summary: Create an invite
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/create-invite-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/invite.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /channels/{channel_id}/recipients/{user_id}:
    put:
      operationId: addGroupDmRecipient
      summary: Add a user to a group DM
      description: Any member may add a user, up to 10 members in total. Posts a RECIPIENT_ADD system message and dispatches CHANNEL_RECIPIENT_ADD to the members and CHANNEL_CREATE to the new member. In Ephemeral mode the adding client issues the MLS Add commit.
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/user_id"
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeGroupDmRecipient
      summary: Remove a user from a group DM, or leave with @me
      description: Only the owner removes others; any member leaves with user_id @me. Leaving as owner transfers ownership to the longest-standing member. Posts a RECIPIENT_REMOVE system message and dispatches CHANNEL_RECIPIENT_REMOVE to the remaining members and CHANNEL_DELETE to the removed user. In Ephemeral mode a remaining client issues the MLS Remove commit.
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - $ref: "#/components/parameters/user_id"
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /channels/{channel_id}/thread-members/{user_id}:
    put:
      operationId: addThreadMember
      summary: Join a thread or invite a guild member
      description: >-
        Use @me to join a visible public thread. A thread manager may add a guild member;
        members may invite others to an invitable private thread. The target must be able
        to view the parent channel. A locked thread requires MANAGE_THREADS.
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - name: user_id
          in: path
          required: true
          schema:
            $ref: ../schemas/rest/thread-member-target.json
      responses:
        "204":
          description: Joined or already a member.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removeThreadMember
      summary: Leave a thread or remove a member
      description: Use @me to leave; removing another user requires MANAGE_THREADS.
      tags:
        - Channels
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/channel_id"
        - name: user_id
          in: path
          required: true
          schema:
            $ref: ../schemas/rest/thread-member-target.json
      responses:
        "204":
          description: Left or already absent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
