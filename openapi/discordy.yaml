openapi: 3.1.0
info:
  title: Discordy REST API
  version: 0.1.0
  description: |-
    Public REST API of Discordy (`/api/v1`). JSON, snake_case, Discord API v10 object shapes plus Discordy extras (Channel.delivery_mode, Channel.voice_region, Guild.voice_region, UserSettings.default_delivery_mode, Device).

    IDs are Snowflakes serialized as decimal strings, except scheduled-message request/resource IDs, which are lowercase UUIDv4 keys. Permission sets are decimal strings.

    Operations tagged `x-discordy-service: messages` are served by the messages service (routed for `/api/v1/channels/{id}/messages*`, pins and attachments); everything else by api.

    Every response may carry the rate-limit headers `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`, `X-RateLimit-Reset-After` and `X-RateLimit-Bucket`.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: https://discordy-api.voics.nl/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local compose ingress
security:
  - UserBearer: []
  - BotToken: []
tags:
  - name: Auth
    description: Registration, login and token rotation.
  - name: Devices
    description: Device identity keys and MLS key packages.
  - name: Users
    description: Users, settings, DMs, relationships and per-chat delivery modes.
  - name: Guilds
    description: Guilds, channels, roles, members, bans, emojis and audit logs.
  - name: Channels
    description: Channel settings, overwrites, invites, typing and threads.
  - name: Invites
    description: Resolve, accept and revoke invites.
  - name: Messages
    description: Standard-mode messages, reactions, pins, read states and attachments (messages service).
  - name: Applications
    description: Applications and bot users.
  - name: Application Commands
    description: Global and guild application commands.
  - name: Interactions
    description: Interaction responses and the original response message.
  - name: Webhooks
    description: Incoming webhooks and interaction follow-ups.
  - name: OAuth2
    description: Bot invite authorization.
  - name: Voice
    description: Voice regions.
paths:
  /gifs/previews:
    post:
      operationId: signGifPreviews
      summary: Refresh signed previews for favorite GIFs
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  maxItems: 48
                  items:
                    type: string
      responses:
        "200":
          description: Signed media proxy URLs in request order.
          content:
            application/json:
              schema:
                type: object
                required: [urls]
                properties:
                  urls:
                    type: array
                    items:
                      type: string
        "400":
          description: A URL is outside the configured provider media hosts.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Provider or media signer unavailable.
  /gifs/trending:
    get:
      operationId: trendingGifs
      summary: Browse trending GIFs
      description: Returns the configured Tenor-v2-compatible provider's featured response. Disabled with 503 until configured.
      tags: [Users]
      responses:
        "200":
          description: Provider response containing results and media_formats.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Provider not configured or unavailable.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /gifs/search:
    get:
      operationId: searchGifs
      summary: Search GIFs
      tags: [Users]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Provider response containing results and media_formats.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid search query.
        "503":
          description: Provider not configured or unavailable.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /gifs/categories:
    get:
      operationId: gifCategories
      summary: Browse GIF categories
      tags: [Users]
      responses:
        "200":
          description: Provider response containing category tags.
          content:
            application/json:
              schema:
                type: object
        "503":
          description: Provider not configured or unavailable.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /reports:
    post:
      operationId: createReport
      summary: Report a message, user or visible guild channel
      description: Channel reports capture only the channel ID, server ID, parent ID, name, type and age-restricted flag from server data. No messages or member list are fetched. Current channel visibility is required. Guild listing reports use the dedicated discovery route.
      tags:
        - Users
      x-discordy-service: api
      security:
        - UserBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/create-report-request.json
      responses:
        "204":
          description: Report accepted or already open. No moderation action is automatic.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/register:
    post:
      operationId: register
      summary: Register a new account
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/register-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/auth-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password (and TOTP when 2FA is enabled)
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/login-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/auth-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Code 60008 with a ticket when the password is right, 2FA is enabled and no code was sent.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/mfa-required-response.json
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate a refresh token
      description: |-
        Reusing an already-rotated refresh token revokes the whole session family, except a bounded retry of the same durably saved request_id and token. For five minutes after rotation, that exact pair may recover only its immediate unused, unexpired successor while the original token and session remain live. Retries do not extend expiry. Missing or mismatched request IDs, elapsed windows and used or expired successors retain reuse detection. Revoked sessions cannot be recovered. Never log tokens or request IDs.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/refresh-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/auth-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Auth
      x-discordy-service: api
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/mfa/totp:
    post:
      operationId: mfaLoginTotp
      summary: Complete a login with a TOTP or backup code
      description: Exchanges the ticket from a 60008 login response and a code for tokens. Wrong codes are rate limited per user and lock the ticket out for a while.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/mfa-login-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/auth-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Email a password reset token
      description: Always answers 204, whether or not the address is registered, so accounts cannot be enumerated. Rate limited per address and per caller.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/forgot-password-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Revokes every session of the account. Two-factor stays enabled.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/reset-password-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with an emailed token
      description: Marks the account verified; for an email change the new address replaces the old one.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/verify-email-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend the verification email
      description: Rate limited. Answers 400 when the account is already verified.
      tags:
        - Auth
      x-discordy-service: api
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /devices:
    post:
      operationId: createDevice
      summary: Register a device and its identity key
      tags:
        - Devices
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/create-device-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/create-device-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /devices/{device_id}/key-packages:
    post:
      operationId: uploadKeyPackages
      summary: Upload MLS key packages for a device
      tags:
        - Devices
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/device_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/upload-key-packages-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/{user_id}/devices:
    get:
      operationId: listUserDevices
      summary: List a user's devices and identity keys
      tags:
        - Devices
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../schemas/rest/public-device.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/{user_id}/devices/{device_id}/key-packages/claim:
    post:
      operationId: claimKeyPackage
      summary: Claim one MLS key package of a device
      tags:
        - Devices
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
        - $ref: "#/components/parameters/device_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/claim-key-package-response.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/connections:
    get:
      operationId: listConnections
      summary: List the current user's linked accounts
      tags: [Users]
      x-discordy-service: api
      responses:
        "200":
          description: Connections including hidden accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [provider, account_id, name, visible]
                  properties:
                    provider: { type: string, enum: [github] }
                    account_id: { type: string }
                    name: { type: string }
                    visible: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateConnection
      summary: Set a linked account's profile visibility
      tags: [Users]
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, visible]
              properties:
                provider: { type: string, enum: [github] }
                visible: { type: boolean }
      responses:
        "204": { description: Visibility updated. }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: removeConnection
      summary: Remove a linked account
      tags: [Users]
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [github] }
      responses:
        "204": { description: Connection removed. }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /users/@me/connections/github/authorize:
    post:
      operationId: authorizeGithubConnection
      summary: Begin GitHub authorization in the browser
      tags: [Users]
      x-discordy-service: api
      responses:
        "200":
          description: Provider authorization URL.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "503": { description: Provider disabled or unavailable. }
  /users/@me/connections/{provider}:
    parameters:
      - { in: path, name: provider, required: true, schema: { type: string, enum: [github] } }
    put:
      operationId: setConnectionVisibility
      summary: Set profile visibility of a linked account
      tags: [Users]
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visible]
              properties:
                visible: { type: boolean }
      responses:
        "204": { description: Visibility updated. }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteConnection
      summary: Remove a linked account
      tags: [Users]
      x-discordy-service: api
      responses:
        "204": { description: Connection removed. }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /users/{user_id}/connections:
    parameters:
      - { in: path, name: user_id, required: true, schema: { type: string } }
    get:
      operationId: listUserConnections
      summary: List a user's visible linked accounts
      tags: [Users]
      x-discordy-service: api
      responses:
        "200":
          description: Visible connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [provider, account_id, name, visible]
                  properties:
                    provider: { type: string, enum: [github] }
                    account_id: { type: string }
                    name: { type: string }
                    visible: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /connections/github/callback:
    get:
      operationId: githubConnectionCallback
      summary: Complete a GitHub authorization
      security: []
      tags: [Users]
      x-discordy-service: api
      parameters:
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, required: false, schema: { type: string }, description: Present on approval. }
        - { in: query, name: error, required: false, schema: { type: string, enum: [access_denied] }, description: Present when the user declines. }
      responses:
        "200": { description: Account linked or authorization cancelled; browser may be closed. }
        "400": { $ref: '#/components/responses/BadRequest' }
  /users/@me:
    get:
      operationId: getCurrentUser
      summary: Get the current user
      tags:
        - Users
      x-discordy-service: api
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: modifyCurrentUser
      summary: Modify the current user
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/modify-current-user-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/disable:
    post:
      operationId: disableAccount
      summary: Disable the account
      description: Revokes every session. Logging in again reactivates the account.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/password-confirmation-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/delete:
    post:
      operationId: deleteAccount
      summary: Schedule account deletion
      description: Revokes every session and schedules deletion after the retention window (14 days); logging in before then cancels it. Refused with 400 while the user still owns guilds.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/password-confirmation-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/mfa/totp/enable:
    post:
      operationId: enableTotp
      summary: Start TOTP enrolment
      description: Generates a pending secret and returns it with an otpauth URI. 2FA stays off until verified; calling again replaces the pending secret.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/password-confirmation-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/totp-enrollment-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/mfa/totp/verify:
    post:
      operationId: verifyTotp
      summary: Confirm TOTP enrolment
      description: Activates 2FA, sets `mfa_enabled`, dispatches USER_UPDATE and returns ten backup codes, shown once. Wrong codes are rate limited.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/verify-totp-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/backup-codes-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/mfa/totp/disable:
    post:
      operationId: disableTotp
      summary: Disable TOTP
      description: Needs the password and a TOTP or backup code. Removes the secret and every backup code.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/disable-totp-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/mfa/codes-verification:
    post:
      operationId: verifyBackupCodes
      summary: List or regenerate backup codes
      description: Needs the password. Without `regenerate` it lists consumed states only (codes are hashed at rest); with it, the old codes die and the new plaintext codes are returned once.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/backup-codes-verification-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/backup-codes-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/{user_id}:
    get:
      operationId: getUser
      summary: Get a user
      tags:
        - Users
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
