openapi: 3.1.0
info:
  title: Discordy REST API
  version: 0.1.0
  description: |-
    Public REST API of Discordy (`/api/v1`). JSON, snake_case, Discord API v10 object shapes plus Discordy extras (Channel.delivery_mode, Channel.voice_region, Guild.voice_region, UserSettings.default_delivery_mode, Device).

    IDs are Snowflakes serialized as decimal strings. Permission sets are decimal strings.

    Operations tagged `x-discordy-service: messages` are served by the messages service (routed for `/api/v1/channels/{id}/messages*`, pins and attachments); everything else by api.

    Every response may carry the rate-limit headers `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`, `X-RateLimit-Reset-After` and `X-RateLimit-Bucket`.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: https://discordy-api.voics.nl/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local compose ingress
security:
  - UserBearer: []
  - BotToken: []
tags:
  - name: Auth
    description: Registration, login and token rotation.
  - name: Devices
    description: Device identity keys and MLS key packages.
  - name: Users
    description: Users, settings, DMs, relationships and per-chat delivery modes.
  - name: Guilds
    description: Guilds, channels, roles, members, bans, emojis and audit logs.
  - name: Channels
    description: Channel settings, overwrites, invites, typing and threads.
  - name: Invites
    description: Resolve, accept and revoke invites.
  - name: Messages
    description: Standard-mode messages, reactions, pins, read states and attachments (messages service).
  - name: Applications
    description: Applications and bot users.
  - name: Application Commands
    description: Global and guild application commands.
  - name: Interactions
    description: Interaction responses and the original response message.
  - name: Webhooks
    description: Incoming webhooks and interaction follow-ups.
  - name: OAuth2
    description: Bot invite authorization.
  - name: Voice
    description: Voice regions.
paths:
  /auth/register:
    post:
      operationId: register
      summary: Register a new account
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/register-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/auth-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password (and TOTP when 2FA is enabled)
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/login-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/auth-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Code 60008 with a ticket when the password is right, 2FA is enabled and no code was sent.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/mfa-required-response.json
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate a refresh token
      description: |-
        Reusing an already-rotated refresh token revokes the whole session family, except a bounded retry of the same durably saved request_id and token. For five minutes after rotation, that exact pair may recover only its immediate unused, unexpired successor while the original token and session remain live. Retries do not extend expiry. Missing or mismatched request IDs, elapsed windows and used or expired successors retain reuse detection. Revoked sessions cannot be recovered. Never log tokens or request IDs.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/refresh-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/auth-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Auth
      x-discordy-service: api
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/mfa/totp:
    post:
      operationId: mfaLoginTotp
      summary: Complete a login with a TOTP or backup code
      description: Exchanges the ticket from a 60008 login response and a code for tokens. Wrong codes are rate limited per user and lock the ticket out for a while.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/mfa-login-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/auth-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Email a password reset token
      description: Always answers 204, whether or not the address is registered, so accounts cannot be enumerated. Rate limited per address and per caller.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/forgot-password-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Revokes every session of the account. Two-factor stays enabled.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/reset-password-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with an emailed token
      description: Marks the account verified; for an email change the new address replaces the old one.
      tags:
        - Auth
      x-discordy-service: api
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/verify-email-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend the verification email
      description: Rate limited. Answers 400 when the account is already verified.
      tags:
        - Auth
      x-discordy-service: api
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /devices:
    post:
      operationId: createDevice
      summary: Register a device and its identity key
      tags:
        - Devices
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/create-device-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/create-device-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /devices/{device_id}/key-packages:
    post:
      operationId: uploadKeyPackages
      summary: Upload MLS key packages for a device
      tags:
        - Devices
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/device_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/upload-key-packages-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/{user_id}/devices:
    get:
      operationId: listUserDevices
      summary: List a user's devices and identity keys
      tags:
        - Devices
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../schemas/rest/public-device.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/{user_id}/devices/{device_id}/key-packages/claim:
    post:
      operationId: claimKeyPackage
      summary: Claim one MLS key package of a device
      tags:
        - Devices
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
        - $ref: "#/components/parameters/device_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/claim-key-package-response.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me:
    get:
      operationId: getCurrentUser
      summary: Get the current user
      tags:
        - Users
      x-discordy-service: api
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: modifyCurrentUser
      summary: Modify the current user
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/modify-current-user-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/disable:
    post:
      operationId: disableAccount
      summary: Disable the account
      description: Revokes every session. Logging in again reactivates the account.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/password-confirmation-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/delete:
    post:
      operationId: deleteAccount
      summary: Schedule account deletion
      description: Revokes every session and schedules deletion after the retention window (14 days); logging in before then cancels it. Refused with 400 while the user still owns guilds.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/password-confirmation-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/mfa/totp/enable:
    post:
      operationId: enableTotp
      summary: Start TOTP enrolment
      description: Generates a pending secret and returns it with an otpauth URI. 2FA stays off until verified; calling again replaces the pending secret.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/password-confirmation-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/totp-enrollment-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/mfa/totp/verify:
    post:
      operationId: verifyTotp
      summary: Confirm TOTP enrolment
      description: Activates 2FA, sets `mfa_enabled`, dispatches USER_UPDATE and returns ten backup codes, shown once. Wrong codes are rate limited.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/verify-totp-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/backup-codes-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/mfa/totp/disable:
    post:
      operationId: disableTotp
      summary: Disable TOTP
      description: Needs the password and a TOTP or backup code. Removes the secret and every backup code.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/disable-totp-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/mfa/codes-verification:
    post:
      operationId: verifyBackupCodes
      summary: List or regenerate backup codes
      description: Needs the password. Without `regenerate` it lists consumed states only (codes are hashed at rest); with it, the old codes die and the new plaintext codes are returned once.
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/backup-codes-verification-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/backup-codes-response.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/{user_id}:
    get:
      operationId: getUser
      summary: Get a user
      tags:
        - Users
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/{user_id}/profile:
    get:
      operationId: getUserProfile
      summary: Get a user's profile with mutual servers and mutual friends
      tags:
        - Users
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/user-profile.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/sessions:
    get:
      operationId: listSessions
      summary: List the current user's login sessions
      description: Active (not revoked, not expired) sessions with the client, OS, approximate location and last activity. The session making the request has `current` set.
      tags:
        - Users
      x-discordy-service: api
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../schemas/objects/auth-session.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/sessions/logout-all:
    post:
      operationId: logoutOtherSessions
      summary: Log out every other session
      description: Revokes every session except the current one right away; their access tokens stop working and their live gateway connections are closed.
      tags:
        - Users
      x-discordy-service: api
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/sessions/{session_id}:
    delete:
      operationId: revokeSession
      summary: Log out one session
      description: Revokes another session of the current user right away. The current session cannot be revoked here (400 `CANNOT_REVOKE_CURRENT_SESSION`; use `POST /auth/logout`).
      tags:
        - Users
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/session_id"
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/settings:
    get:
      operationId: getUserSettings
      summary: Get the current user's settings
      tags:
        - Users
      x-discordy-service: api
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user-settings.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: modifyUserSettings
      summary: Modify the current user's settings (including default_delivery_mode)
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/modify-user-settings-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user-settings.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/guilds/{guild_id}/settings:
    parameters:
      - name: guild_id
        in: path
        required: true
        description: Guild ID, or `@me` for direct messages and group DMs.
        schema:
          type: string
    get:
      operationId: getGuildNotificationSettings
      summary: Get the current user's notification settings for a guild (or `@me` for DMs)
      tags:
        - Users
      x-discordy-service: api
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/guild-notification-settings.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      operationId: modifyGuildNotificationSettings
      summary: Modify the current user's notification settings for a guild (or `@me` for DMs)
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/modify-guild-notification-settings-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/guild-notification-settings.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/notes/{user_id}:
    get:
      operationId: getUserNote
      summary: Get the current user's private note about a user (404 when none)
      tags:
        - Users
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/user-note.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      operationId: putUserNote
      summary: Set the current user's private note about a user (empty deletes it)
      tags:
        - Users
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/rest/put-note-request.json
      responses:
        "204":
          description: No content.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteUserNote
      summary: Delete the current user's private note about a user
      tags:
        - Users
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/user_id"
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/@me/channels:
    get:
      operationId: listPrivateChannels
      summary: List DMs and group DMs
      tags:
        - Users
      x-discordy-service: api
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../schemas/objects/channel.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createDm
      summary: Open a DM or create a group DM
      tags:
        - Users
      x-discordy-service: api
      requestBody:
        required: true
        content:
