components:
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (EdDSA JWT, 15 minutes).
    BotToken:
      type: apiKey
      in: header
      name: Authorization
      description: "`Bot <base64url(bot_user_id)>.<secret>`"
  parameters:
    user_id:
      name: user_id
      in: path
      required: true
      description: User ID.
      schema: *a1
    device_id:
      name: device_id
      in: path
      required: true
      description: Device ID.
      schema: *a1
    channel_id:
      name: channel_id
      in: path
      required: true
      description: Channel ID.
      schema: *a1
    guild_id:
      name: guild_id
      in: path
      required: true
      description: Guild ID.
      schema: *a1
    role_id:
      name: role_id
      in: path
      required: true
      description: Role ID.
      schema: *a1
    message_id:
      name: message_id
      in: path
      required: true
      description: Message ID.
      schema: *a1
    emoji_id:
      name: emoji_id
      in: path
      required: true
      description: Emoji ID.
      schema: *a1
    overwrite_id:
      name: overwrite_id
      in: path
      required: true
      description: Role or user ID of the overwrite.
      schema: *a1
    application_id:
      name: application_id
      in: path
      required: true
      description: Application ID.
      schema: *a1
    command_id:
      name: command_id
      in: path
      required: true
      description: Application command ID.
      schema: *a1
    interaction_id:
      name: interaction_id
      in: path
      required: true
      description: Interaction ID.
      schema: *a1
    webhook_id:
      name: webhook_id
      in: path
      required: true
      description: Webhook ID, or the application ID for interaction webhooks.
      schema: *a1
    webhook_token:
      name: webhook_token
      in: path
      required: true
      description: Webhook token, or the interaction token for interaction webhooks.
      schema:
        type: string
    interaction_token:
      name: interaction_token
      in: path
      required: true
      description: Interaction token.
      schema:
        type: string
    code:
      name: code
      in: path
      required: true
      description: Invite code.
      schema:
        type: string
    emoji:
      name: emoji
      in: path
      required: true
      description: URL-encoded unicode emoji, or `name:id` for a custom emoji.
      schema:
        type: string
  headers:
    X-RateLimit-Limit:
      description: Requests allowed in the bucket window.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix seconds when the bucket resets.
      schema:
        type: number
    X-RateLimit-Reset-After:
      description: Seconds until the bucket resets.
      schema:
        type: number
    X-RateLimit-Bucket:
      description: Bucket identifier.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request (code 50035 invalid form body).
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
    Unauthorized:
      description: Missing or invalid token (code 40001).
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
    Forbidden:
      description: Missing access (50001) or permissions (50013).
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
    NotFound:
      description: Unknown resource (10xxx codes).
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
    DeliveryModeConflict:
      description: The channel's effective delivery mode is not standard (code 50160).
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
    RateLimited:
      description: Rate limited (code 429).
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: number
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        X-RateLimit-Reset-After:
          $ref: "#/components/headers/X-RateLimit-Reset-After"
        X-RateLimit-Bucket:
          $ref: "#/components/headers/X-RateLimit-Bucket"
      content:
        application/json:
          schema:
            $ref: ../schemas/objects/error.json
