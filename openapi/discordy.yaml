              $ref: ../schemas/rest/create-webhook-request.json
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/objects/webhook.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /discovery/guilds:
    get:
      operationId: listDiscoveryGuilds
      summary: Browse and search public servers that opted in to discovery
      tags:
        - Guilds
      x-discordy-service: api
      parameters:
        - name: query
          in: query
          required: false
          description: Case-insensitive match on name, description and tags.
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Category slug.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Exact tag.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (1-50, default 24).
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: offset
