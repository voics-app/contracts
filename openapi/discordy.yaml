              schema:
                type: array
                items: &appeal
                  type: object
                  required: [id, user_id, question, answer, status, created_at, resolved_at, resolved_by]
                  properties:
                    id: { type: string }
                    user_id: { type: string }
                    question: { type: string }
                    answer: { type: string }
                    status: { type: string, enum: [open, accepted, denied, closed] }
                    created_at: { type: string, format: date-time }
                    resolved_at: { type: [string, 'null'], format: date-time }
                    resolved_by: { type: [string, 'null'] }
        "401": { $ref: "#/components/responses/Unauthorized" }
