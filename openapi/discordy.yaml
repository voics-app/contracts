  /guilds/{guild_id}/prune:
    get:
      operationId: getGuildPruneCount
      summary: Count members a prune would remove
      description: >-
        Discordy extra (dry run). Counts the members who joined more than `days` ago, have no
        login session used within that window and hold no role besides `include_roles`. The
        owner, bots and members the caller does not outrank are never counted. Needs
        KICK_MEMBERS, or ADMINISTRATOR when the guild's
        `prune_admin_only` is true.
      tags:
        - Guilds
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/guild_id"
        - name: days
          in: query
          required: false
          description: Days of inactivity (1-30).
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 7
        - name: include_roles
          in: query
          required: false
          description: Comma separated role IDs that do not protect their members.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: ../schemas/rest/prune-result.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: pruneGuildMembers
      summary: Prune inactive members
      description: >-
        Discordy extra. Removes the members a `GET` of the same parameters counts and writes one
        MEMBER_PRUNE audit log entry with `delete_member_days` and `members_removed`. Same
        permission rule as the dry run.
      tags:
        - Guilds
      x-discordy-service: api
      parameters:
        - $ref: "#/components/parameters/guild_id"
      requestBody:
        required: false
        content:
